<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>MAH Cam</title>
  <style>
    :root {
      --ground: #0a0d14;
      --surface: #10141e;
      --ink: #f8fafc;
      --muted: #94a3b8;
      --amber: #e5b875;
      --line: rgba(255,255,255,.08);
      --ok: #8dffa8;
      --bad: #ff8e8e;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; min-height: 100%; height: 100%;
      background: radial-gradient(120% 80% at 50% -20%, #1a2233 0%, var(--ground) 55%);
      color: var(--ink);
      font-family: "Segoe UI", system-ui, sans-serif;
    }
    .wrap {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      padding: 20px 18px calc(20px + env(safe-area-inset-bottom));
      max-width: 480px;
      margin: 0 auto;
    }
    .brand {
      letter-spacing: .14em;
      font-weight: 700;
      font-size: 1.35rem;
      color: var(--amber);
      margin: 0;
    }
    .sub {
      color: var(--muted);
      font-size: 13px;
      margin: 6px 0 16px;
      line-height: 1.45;
    }
    .stage {
      position: relative;
      flex: 1;
      min-height: 240px;
      border-radius: 16px;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--line);
    }
    video, canvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background: #000;
    }
    canvas { display: none; }
    .hint {
      position: absolute; inset: 0;
      display: grid; place-items: center;
      padding: 24px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      pointer-events: none;
    }
    .hint.hide { display: none; }
    .cta {
      margin-top: 16px;
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 16px 18px;
      font-size: 16px;
      font-weight: 600;
      background: var(--amber);
      color: var(--ground);
      cursor: pointer;
    }
    .cta:disabled { opacity: .45; cursor: default; }
    .cta.stop { background: transparent; color: var(--amber); border: 1px solid var(--amber); }
    .status {
      margin-top: 12px;
      font-family: ui-monospace, Consolas, monospace;
      font-size: 12px;
      color: var(--muted);
      min-height: 1.4em;
    }
    .status.ok { color: var(--ok); }
    .status.bad { color: var(--bad); }
    .steps {
      margin: 0 0 12px;
      padding: 0;
      list-style: none;
      font-size: 13px;
      color: var(--muted);
    }
    .steps li { margin: 4px 0; }
    .steps b { color: var(--ink); font-weight: 600; }
  </style>
</head>
<body>
  <div class="wrap">
    <p class="brand">MAH CAM</p>
    <p class="sub">Phone camera → OBS. Same Wi‑Fi (or USB tether). One tap.</p>
    <ol class="steps">
      <li><b>1.</b> Allow camera when asked</li>
      <li><b>2.</b> Keep this tab open while streaming</li>
    </ol>
    <div class="stage">
      <video id="preview" playsinline muted autoplay></video>
      <canvas id="canvas"></canvas>
      <div class="hint" id="hint">Ready when you are</div>
    </div>
    <button class="cta" id="btn" type="button">Allow camera &amp; start</button>
    <div class="status" id="status">Waiting…</div>
  </div>
  <script>
(function () {
  const params = new URLSearchParams(location.search);
  const pairing = (params.get("p") || params.get("pairing") || "MAH1").trim();
  const fps = Math.min(24, Math.max(8, parseInt(params.get("fps") || "12", 10)));
  const quality = Math.min(0.92, Math.max(0.4, parseFloat(params.get("q") || "0.7")));

  const video = document.getElementById("preview");
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d", { alpha: false });
  const btn = document.getElementById("btn");
  const status = document.getElementById("status");
  const hint = document.getElementById("hint");

  let stream = null;
  let ws = null;
  let timer = null;
  let running = false;

  function setStatus(msg, kind) {
    status.textContent = msg;
    status.className = "status" + (kind ? " " + kind : "");
  }

  function wsUrl() {
    const proto = location.protocol === "https:" ? "wss:" : "ws:";
    return proto + "//" + location.host + "/ws?p=" + encodeURIComponent(pairing);
  }

  function sendJpegBlob(blob) {
    if (!ws || ws.readyState !== 1) return;
    blob.arrayBuffer().then(function (buf) {
      const u8 = new Uint8Array(buf);
      const out = new Uint8Array(5 + u8.length);
      out[0] = 0x56; /* 'V' */
      out[1] = (u8.length >>> 24) & 255;
      out[2] = (u8.length >>> 16) & 255;
      out[3] = (u8.length >>> 8) & 255;
      out[4] = u8.length & 255;
      out.set(u8, 5);
      ws.send(out);
    });
  }

  function tick() {
    if (!running || !stream) return;
    const w = video.videoWidth || 1280;
    const h = video.videoHeight || 720;
    if (w < 2 || h < 2) return;
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w;
      canvas.height = h;
    }
    ctx.drawImage(video, 0, 0, w, h);
    canvas.toBlob(function (blob) {
      if (blob) sendJpegBlob(blob);
    }, "image/jpeg", quality);
  }

  function stopAll() {
    running = false;
    if (timer) { clearInterval(timer); timer = null; }
    if (ws) { try { ws.close(); } catch (e) {} ws = null; }
    if (stream) {
      stream.getTracks().forEach(function (t) { t.stop(); });
      stream = null;
    }
    video.srcObject = null;
    hint.classList.remove("hide");
    btn.textContent = "Allow camera & start";
    btn.classList.remove("stop");
    btn.disabled = false;
    setStatus("Stopped");
  }

  async function start() {
    btn.disabled = true;
    setStatus("Asking for camera…");
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: {
          facingMode: { ideal: "user" },
          width: { ideal: 1280 },
          height: { ideal: 720 }
        }
      });
      video.srcObject = stream;
      hint.classList.add("hide");
      await video.play();

      setStatus("Connecting to OBS…");
      ws = new WebSocket(wsUrl());
      ws.binaryType = "arraybuffer";

      await new Promise(function (resolve, reject) {
        const t = setTimeout(function () { reject(new Error("WebSocket timeout")); }, 8000);
        ws.onopen = function () {
          clearTimeout(t);
          ws.send("MAH1 " + pairing + " 1280x720 mjpeg\n");
          resolve();
        };
        ws.onerror = function () {
          clearTimeout(t);
          reject(new Error("WebSocket failed — same Wi‑Fi as PC?"));
        };
      });

      running = true;
      timer = setInterval(tick, Math.round(1000 / fps));
      btn.textContent = "Stop";
      btn.classList.add("stop");
      btn.disabled = false;
      setStatus("Live → OBS", "ok");

      ws.onclose = function () {
        if (running) {
          setStatus("Disconnected from OBS", "bad");
          stopAll();
        }
      };
    } catch (e) {
      setStatus(e.message || String(e), "bad");
      stopAll();
    }
  }

  btn.addEventListener("click", function () {
    if (running) stopAll();
    else start();
  });

  setStatus("Pairing " + pairing + " · " + location.host);
})();
  </script>
</body>
</html>
