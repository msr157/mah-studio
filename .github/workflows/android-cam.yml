name: MAH Cam Android

on:
  push:
    paths:
      - "mobile/android/**"
      - ".github/workflows/android-cam.yml"
  pull_request:
    paths:
      - "mobile/android/**"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Assemble debug
        run: |
          if [ -f gradlew ]; then
            ./gradlew assembleDebug --no-daemon
          else
            echo "No Gradle wrapper JAR yet — open in Android Studio once to generate, or add wrapper."
            exit 0
          fi
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: mahcam-debug
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
